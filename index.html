<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Page Setup */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Fixed Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #0ea5e9);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hero Section (Fills the first screen) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        /* Glassmorphism Card Effect */
        .container {
            padding: 3rem 2rem;
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 85%;
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: #cbd5e1;
            font-weight: 300;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Loading Dots */
        .loader {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #38bdf8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Scroll Down Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            font-size: 0.9rem;
            color: #94a3b8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(5px); }
        }

        /* Game Section */
        .game-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .game-wrapper {
            backdrop-filter: blur(16px);
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        canvas {
            background-color: #0f172a;
            border-radius: 8px;
            border: 2px solid #334155;
            display: block;
            margin-top: 1rem;
            max-width: 100%;
            cursor: pointer;
        }

        .game-instructions {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            p { font-size: 1.1rem; }
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <section class="hero">
        <div class="container">
            <h1>Just bought this domain.</h1>
            <p>This website is currently a work in progress. Something awesome is on the way.</p>
            
            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        
        <div class="scroll-indicator">
            Scroll down for a break 👇
        </div>
    </section>

    <section class="game-section">
        <div class="game-wrapper">
            <h2 style="margin: 0 0 5px 0;">Mini Dash</h2>
            <div style="color: #38bdf8; font-weight: 600;" id="scoreDisplay">Score: 0</div>
            
            <canvas id="gameCanvas" width="600" height="250"></canvas>
            
            <div class="game-instructions">
                <strong>How to play:</strong> Press Spacebar or Click/Tap the game to jump.
            </div>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');

        // Game Variables
        let isGameOver = false;
        let score = 0;
        let frames = 0;
        let gameSpeed = 5;

        // Player Object
        const player = {
            x: 50,
            y: 180,
            width: 30,
            height: 30,
            dy: 0,
            gravity: 0.6,
            jumpPower: -10,
            isGrounded: true
        };

        let obstacles = [];

        // Controls
        function jump() {
            if (isGameOver) {
                resetGame();
                return;
            }
            if (player.isGrounded) {
                player.dy = player.jumpPower;
                player.isGrounded = false;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent scrolling when pressing space
                jump();
            }
        });
        canvas.addEventListener('mousedown', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        function resetGame() {
            isGameOver = false;
            score = 0;
            frames = 0;
            gameSpeed = 5;
            obstacles = [];
            player.y = 180;
            player.dy = 0;
            scoreDisplay.innerText = `Score: 0`;
            gameLoop();
        }

        function gameLoop() {
            if (isGameOver) return;
            requestAnimationFrame(gameLoop);

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Floor
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 210, canvas.width, 40);
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, 210, canvas.width, 2);

            // Player Physics
            player.dy += player.gravity;
            player.y += player.dy;

            // Ground Collision
            if (player.y + player.height >= 210) {
                player.y = 210 - player.height;
                player.dy = 0;
                player.isGrounded = true;
            }

            // Draw Player (Neon Blue Cube)
            ctx.fillStyle = '#38bdf8';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#38bdf8';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0; // Reset shadow for other elements

            // Handle Obstacles
            if (frames % Math.floor(Math.random() * 60 + 60) === 0) {
                // Spawn obstacle
                let minHeight = 20;
                let maxHeight = 40;
                let height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                obstacles.push({
                    x: canvas.width,
                    y: 210 - height,
                    width: 20,
                    height: height,
                    passed: false
                });
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Draw Obstacle (Neon Pink Rectangle)
                ctx.fillStyle = '#f43f5e';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f43f5e';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;

                // Score Logic
                if (obs.x + obs.width < player.x && !obs.passed) {
                    score++;
                    scoreDisplay.innerText = `Score: ${score}`;
                    obs.passed = true;
                    // Slightly increase speed as score goes up
                    if (score % 5 === 0) gameSpeed += 0.5; 
                }

                // Collision Detection
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.height + player.y > obs.y
                ) {
                    isGameOver = true;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 24px Inter';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
                    ctx.font = '16px Inter';
                    ctx.fillText('Click or press Space to restart', canvas.width / 2, canvas.height / 2 + 20);
                }
            }

            // Remove off-screen obstacles
            obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

            frames++;
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
